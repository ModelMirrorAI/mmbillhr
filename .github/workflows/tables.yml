# Tests the model on every pull request and on `main`; after a change lands on
# `main`, regenerates tables/ and charts/ and proposes them as a pull request.
#
# `main` takes changes only by pull request, so the regenerated outputs travel
# the same way: the `outputs` job commits them to the `bot/regenerate-outputs`
# branch, opens (or refreshes) a pull request from it, and dispatches this
# workflow on that branch so the required `test` check reports on the bot's
# commit. A pull request opened with the workflow token fires no
# `pull_request` run of its own; a `workflow_dispatch` is the one event that
# token may start. Merging that pull request changes only generated files, so
# the next `outputs` run finds nothing to commit and the loop ends there.
name: test-and-tables

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q tests

  outputs:
    needs: test
    # Only `main`'s own code regenerates outputs; a dispatch on the bot branch
    # is there to run `test`, nothing else.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write        # push the bot branch
      pull-requests: write   # open or update its pull request
      actions: write         # dispatch `test` on the bot branch
    concurrency:
      group: outputs
      cancel-in-progress: false  # queue runs so two never push at once
    env:
      BRANCH: bot/regenerate-outputs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/generate_tables.py
      - run: python scripts/generate_charts.py
      - name: Propose regenerated tables and charts
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          git add tables charts
          if git diff --cached --quiet; then
            echo "Tables and charts unchanged."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Regenerate tables and charts"
          # The branch is the bot's alone and always rebuilt from `main`, so a
          # force push replaces any proposal `main` has since overtaken.
          git push --force \
            "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" \
            "HEAD:refs/heads/${BRANCH}"
          if [ -z "$(gh pr list --repo "$REPO" --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            gh pr create --repo "$REPO" --base main --head "$BRANCH" \
              --title "Regenerate tables and charts" \
              --body "Outputs regenerated by the \`outputs\` job from \`main\` at ${GITHUB_SHA}. Only \`tables/\` and \`charts/\` change."
          fi
          gh workflow run tables.yml --repo "$REPO" --ref "$BRANCH"
