# .github/workflows/tables.yml
name: test-and-tables

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only unless a job asks for more.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q tests

  outputs:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write          # only this job may push
    concurrency:
      group: outputs-${{ github.ref }}
      cancel-in-progress: false  # queue runs so two never push at once
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/generate_tables.py
      - run: python scripts/generate_charts.py
      - name: Commit regenerated tables and charts if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tables charts
          if git diff --cached --quiet; then
            echo "Tables and charts unchanged."
          else
            git commit -m "Regenerate tables and charts [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
